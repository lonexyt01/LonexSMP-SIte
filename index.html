<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LonexNetwork Global Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{background:radial-gradient(circle at top,#0a0f2c,#050816 60%);color:white;}
header{text-align:center;padding:30px;font-size:45px;background:linear-gradient(90deg,#00c6ff,#0072ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#onlineCount{margin-top:5px;color:#00c6ff;font-weight:bold;}
.chat-container{max-width:900px;margin:20px auto;background:#0c1224;padding:20px;border-radius:15px;height:500px;overflow-y:auto;border:1px solid #0072ff44;}
.message{margin-bottom:10px;word-wrap:break-word;}
.username{color:#00c6ff;font-weight:bold;margin-right:5px;}
.timestamp{color:#0072ff;font-size:0.8em;margin-left:5px;}
input,button{padding:10px;border-radius:8px;border:none;margin:5px;}
input{width:70%;}
button{background:linear-gradient(90deg,#00c6ff,#0072ff);color:white;font-weight:bold;cursor:pointer;}
button:hover{transform:scale(1.05);transition:0.3s;}
</style>
</head>
<body>

<header>LonexNetwork Global Chat</header>
<div style="text-align:center;margin:10px;">
<input type="text" id="username" placeholder="Username">
<button onclick="setUsername()">Kirish</button>
<div id="onlineCount"></div>
</div>

<div class="chat-container" id="chat"></div>
<div style="text-align:center;margin:10px;">
<input type="text" id="message" placeholder="Xabaringizni yozing" disabled>
<button id="sendBtn" onclick="sendMessage()" disabled>Yuborish</button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase konfiguratsiyasi
const firebaseConfig = {
  apiKey: "SENING_API_KEY",
  authDomain: "SENING_PROJECT.firebaseapp.com",
  databaseURL: "https://SENING_PROJECT.firebaseio.com",
  projectId: "SENING_PROJECT",
  storageBucket: "SENING_PROJECT.appspot.com",
  messagingSenderId: "123456789",
  appId: "SENING_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let username = "";

// Username o'rnatish va online holat
function setUsername(){
  const input = document.getElementById("username");
  if(input.value.trim() === "") return alert("Username kiriting!");
  username = input.value.trim();
  input.disabled = true;
  document.getElementById("message").disabled = false;
  document.getElementById("sendBtn").disabled = false;

  const userRef = db.ref('online/' + username);
  userRef.set(true);
  userRef.onDisconnect().remove();
}

// Xabar yuborish
function sendMessage(){
  const msgInput = document.getElementById("message");
  const text = msgInput.value.trim();
  if(text === "") return;
  db.ref('messages').push({
    username: username,
    message: text,
    timestamp: Date.now()
  });
  msgInput.value = "";
}

// Global chat real-time
const chatDiv = document.getElementById("chat");

// Oldingi xabarlarni olish va realtime yangilash
db.ref('messages').on('value', snapshot => {
  chatDiv.innerHTML = ""; // Har safar qayta chizish
  snapshot.forEach(child => {
    const data = child.val();
    const msgDiv = document.createElement("div");
    msgDiv.className = "message";
    const time = new Date(data.timestamp);
    msgDiv.innerHTML = `<span class="username">${data.username}:</span> ${data.message} <span class='timestamp'>${time.getHours()}:${time.getMinutes().toString().padStart(2,'0')}</span>`;
    chatDiv.appendChild(msgDiv);
  });
  chatDiv.scrollTop = chatDiv.scrollHeight;
});

// Online foydalanuvchilar soni
const onlineCountDiv = document.getElementById("onlineCount");
db.ref('online').on('value', snapshot => {
  const users = snapshot.val() || {};
  const count = Object.keys(users).length;
  onlineCountDiv.innerText = `Online foydalanuvchilar: ${count}`;
});
</script>

</body>
</html>

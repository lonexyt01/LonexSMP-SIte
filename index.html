<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LonexNetwork Global Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
body{background:radial-gradient(circle at top,#0a0f2c,#050816 60%);color:white;}
header{text-align:center;padding:30px;font-size:45px;background:linear-gradient(90deg,#00c6ff,#0072ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#onlineCount{margin-top:5px;color:#00c6ff;font-weight:bold;}
.chat-container{max-width:900px;margin:20px auto;background:#0c1224;padding:20px;border-radius:15px;height:450px;overflow-y:auto;border:1px solid #0072ff44;}
.message{margin-bottom:10px;word-wrap:break-word;}
.username{color:#00c6ff;font-weight:bold;margin-right:5px;}
.timestamp{color:#0072ff;font-size:0.8em;margin-left:5px;}
input,button{padding:10px;border-radius:8px;border:none;margin:5px;}
input[type="text"]{width:60%;}
button{background:linear-gradient(90deg,#00c6ff,#0072ff);color:white;font-weight:bold;cursor:pointer;}
button:hover{transform:scale(1.05);transition:0.3s;}
img.chat-img{max-width:200px;display:block;margin-top:5px;border-radius:8px;}
#imagePreview{max-width:150px;margin-top:5px;border-radius:8px;display:none;}
footer{text-align:center;padding:15px;margin-top:20px;border-top:1px solid #0072ff44;color:#00c6ff;}
</style>
</head>
<body>

<header>LonexNetwork Global Chat</header>
<div style="text-align:center;margin:10px;">
<input type="text" id="username" placeholder="Username">
<button onclick="setUsername()">Kirish</button>
<div id="onlineCount"></div>
</div>

<div class="chat-container" id="chat"></div>

<div style="text-align:center;margin:10px;">
<input type="text" id="message" placeholder="Xabaringizni yozing" disabled>
<input type="file" id="image" accept="image/*" disabled>
<img id="imagePreview">
<button id="sendBtn" onclick="sendMessage()" disabled>Yuborish</button>
</div>

<footer>LonexNetwork – Barcha huquqlar himoyalangan © 2026</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNlrNjMr8ACItG2SQeROi2j1YffyJPcKY",
  authDomain: "lonexnetworkchat.firebaseapp.com",
  databaseURL: "https://lonexnetworkchat-default-rtdb.firebaseio.com",
  projectId: "lonexnetworkchat",
  storageBucket: "lonexnetworkchat.firebasestorage.app",
  messagingSenderId: "70200825390",
  appId: "1:70200825390:web:754f58c0d7c39ac91c31bf",
  measurementId: "G-DWKVHH0MLM"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

let username = "";

// Username saqlash
window.onload = function() {
  const saved = localStorage.getItem("lonexUsername");
  if(saved){
    document.getElementById("username").value = saved;
    setUsername();
  }
}

// Enter bilan yuborish
document.getElementById("message").addEventListener("keydown", function(e){
  if(e.key === "Enter") sendMessage();
});

// Preview rasm
const imageInput = document.getElementById("image");
const imagePreview = document.getElementById("imagePreview");
imageInput.addEventListener("change", function(){
  if(this.files && this.files[0]){
    const reader = new FileReader();
    reader.onload = function(e){
      imagePreview.src = e.target.result;
      imagePreview.style.display = "block";
    }
    reader.readAsDataURL(this.files[0]);
  } else {
    imagePreview.style.display = "none";
  }
});

function setUsername(){
  const input = document.getElementById("username");
  if(input.value.trim() === "") return alert("Username kiriting!");
  username = input.value.trim();
  localStorage.setItem("lonexUsername", username);
  input.disabled = true;
  document.getElementById("message").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("image").disabled = false;

  const userRef = db.ref('online/' + username);
  userRef.set(true);
  userRef.onDisconnect().remove();
}

// Yuborish funksiyasi – MATN + RASM birga ishlaydi
async function sendMessage(){
  const msgInput = document.getElementById("message");
  const file = imageInput.files[0];

  let imageUrl = "";
  if(file){
    const fileName = Date.now() + '_' + file.name.replace(/\s+/g,'_');
    const storageRef = storage.ref('chat-images/' + fileName);
    try {
      await storageRef.put(file);
      imageUrl = await storageRef.getDownloadURL();
    } catch(err){
      alert("Rasm yuborishda xatolik: " + err.message);
      return;
    }
    imageInput.value = "";
    imagePreview.style.display = "none";
  }

  const text = msgInput.value.trim();

  if(text === "" && imageUrl === "") return;

  db.ref('messages').push({
    username: username,
    message: text,
    image: imageUrl,
    timestamp: Date.now()
  });

  msgInput.value = "";
}

// Real-time chat
const chatDiv = document.getElementById("chat");
db.ref('messages').on('value', snapshot => {
  chatDiv.innerHTML = "";
  snapshot.forEach(child => {
    const data = child.val();
    const msgDiv = document.createElement("div");
    msgDiv.className = "message";
    const time = new Date(data.timestamp);
    let content = "";
    if(data.message) content += data.message;
    if(data.image) content += `<br><img src="${data.image}" class="chat-img">`;
    msgDiv.innerHTML = `<span class="username">${data.username}:</span> ${content} <span class='timestamp'>${time.getHours()}:${time.getMinutes().toString().padStart(2,'0')}</span>`;
    chatDiv.appendChild(msgDiv);
  });
  chatDiv.scrollTop = chatDiv.scrollHeight;
});

// Online foydalanuvchilar soni
const onlineCountDiv = document.getElementById("onlineCount");
db.ref('online').on('value', snapshot => {
  const users = snapshot.val() || {};
  onlineCountDiv.innerText = `Online foydalanuvchilar: ${Object.keys(users).length}`;
});
</script>

</body>
</html>

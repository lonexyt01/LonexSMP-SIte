<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qadimgi Dunyo Tarixi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tutorial">
    <h1>Buyuk Ipak yo'li</h1>
    <p>Buyuk Ipak yo'li haqidagi Mavzu bo'yicha 30ta savoldan</p>
    <p2>Iborat Test, Testni boshlash uchun boshlash tugmasini bosing</p2>
    <button id="startBtn">Start</button>
</div>

<div id="levels" class="hidden">
    <h2>Level tanlang</h2>
    <button id="lvl3">Level 1 - Buyuk Ipak Yo'li</button>
</div>

<div id="cards" class="hidden"></div>

<div id="qna" class="hidden">
    <h4 id="questionText"></h4>
    <div id="answerButtons"></div>
</div>

<!-- Particle effect -->
<div id="particles-js"></div>
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
    "color": { "value": "#00ffff" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.5, "random": true },
    "size": { "value": 3, "random": true },
    "line_linked": { "enable": true, "distance": 150, "color": "#0ff", "opacity": 0.4, "width": 1 },
    "move": { "enable": true, "speed": 2, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
  },
  "interactivity": {
    "detect_on": "canvas",
    "events": {
      "onhover": { "enable": true, "mode": "repulse" },
      "onclick": { "enable": true, "mode": "push" }
    },
    "modes": {
      "repulse": { "distance": 100, "duration": 0.4 },
      "push": { "particles_nb": 4 }
    }
  },
  "retina_detect": true
});
</script>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
